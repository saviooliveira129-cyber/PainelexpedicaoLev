 <section><h2>Falta separar: liberado x preso em remanejamento</h2><p class="note">Status GERADA, GERADA COM CORTE e LIBERADA. Preso = GERADA com reabastecimento pendente + GERADA COM CORTE.</p><div class="sc" id="pre"></div></section>
 <section><h2>Cálculo de mão de obra para finalizar a separação</h2><p class="note">${ST.ed?"Informe a produtividade e os colaboradores; salva ao digitar.":"Valores definidos pelos editores."}</p><div class="sc" id="lab"></div></section>
 <section><h2>Histórico por dia</h2><p class="note">Volumes expedidos no dia (pedidos embarcados). O último registro de cada dia fica gravado automaticamente. Editores podem lançar ou corrigir um dia manualmente.</p><div class="ed" style="margin:0 0 12px"><label>Filtrar dia <input type="date" id="hf" value="${ST.hf||""}"></label><button class="gh" id="hfc">Limpar filtro</button></div>${ST.ed?`<div class="ed" style="margin:0 0 12px"><label>Lançar dia <input type="date" id="md" value="${ST.hf||ST.date}"></label><label>Volumes expedidos <input type="number" min="0" inputmode="numeric" id="mv"></label><button class="btn" id="mb">Salvar lançamento</button></div>`:""}<div class="sc" id="hist"></div></section>`;
 bind();draw(true);clock();drawOnline();setPresence()}
function draw(full){
 const A=agg(),T=A.T,L=labor(A),c=W.cut,dia=c.cont+c.c1+c.c2+c.c3+c.c4,base=dia||T.v,all=dia+c.pend,fora=Math.max(0,dia-T.v),falta=T.fv,chs=A.chs;
 const empty=cls=>`<p style="color:var(--mu);text-align:center;padding:16px 0">Sem dados para esta data.${ST.ed?" Use Importar planilha.":""}</p>`;
 $("meta").innerHTML=W.rows.length?`Planilha: <b>${esc(W.file||"—")}</b> · ${fmt(T.p)} pedidos · importada às ${tm(W.upd)}<span class="mo">Atualizado às ${tm(W.edt,1)}</span>`:`<span class="mo">Aguardando importação da planilha</span>`;
 $("kp").innerHTML=`<div class="k f"><span>Volumes total do dia</span><b>${fmt(dia)}</b><small>Soma dos cortes diário</small></div>
  <div class="k b"><span>Pedidos embarcados</span><b>${fmt(fora)}</b><small>${pc(fora,base)} do total · concluído</small></div>
  <div class="k"><span>Já separado</span><b>${fmt(T.sv)}</b><small>${pc(T.sv,base)} do total</small></div>
  <div class="k"><span>Falta separar</span><b>${fmt(falta)}</b><small>${pc(falta,base)} do total</small></div>
  <div class="k"><span>Falta conferir</span><b>${A.hasCf?fmt(T.xv||0):"—"}</b><small>${A.hasCf?pc(T.xv||0,T.v)+" do total":"reimporte a planilha"}</small></div>
  <div class="k ok"><span>Conferidos</span><b>${A.hasCf?fmt(T.cv||0):"—"}</b><small>${A.hasCf?pc(T.cv||0,T.v)+" do total":"reimporte a planilha"}</small></div>
  <div class="k g"><span>Preso em remanejamento</span><b>${fmt(T.pv)}</b><small>${pc(T.pv,T.fv)} do que falta (planilha)</small></div>
  <div class="k"><span>Tempo p/ finalizar</span><b>${hmc(L.MX)}</b><small>Galpões em paralelo</small></div>`;
 const sl=[{v:T.sv,c:"#1BA672"},{v:T.fv,c:"#E0592A"},{v:fora,c:"#3B8BEB"}];
 $("dn").innerHTML=donut(sl,fmt(dia),"VOLUMES TOTAL DO DIA",pc(T.sv+fora,base)+" concluído");
 const row=(col,l,v)=>`<li><i style="background:${col}"></i>${l}<b>${fmt(v)}</b><em>${pc(v,base)}</em></li>`;
 $("lg").innerHTML=row("#1BA672","Já separado",T.sv)+row("#E0592A","Falta separar",T.fv)+row("#3B8BEB","Pedidos embarcados",fora);
 if(!(ST.ed&&inField())){
  $("cuts").innerHTML=`<div class="cr t">Total do dia (cortes diário)<b>${fmt(dia)}</b></div>`+CUTS.map(([k,l])=>`<div class="cr">${l}${ST.ed?`<b><input type="number" min="0" inputmode="numeric" data-k="${k}" value="${c[k]||0}" aria-label="${l}"></b>`:`<b>${fmt(c[k]||0)}</b>`}</div>`).join("")+`<div class="cr t">A embarcar com pendências do dia anterior<b>${fmt(all)}</b></div>`+(ST.ed?`<div class="ed"><button class="gh" id="fill">Preencher cortes pela planilha</button></div>`:"");
  document.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{W.cut[i.dataset.k]=Math.max(0,num(i.value));save();draw()});
  const f=$("fill");if(f)f.onclick=()=>{if(!Object.keys(W.src).length){toast("A planilha não trouxe o corte no Título.",1);return}[1,2,3,4].forEach(n=>W.cut["c"+n]=Math.round(W.src[n]||0));save(true);draw()}}
 const none=`<tr><td colspan="${8+chs.length}" style="text-align:center;color:var(--mu)">Sem dados.</td></tr>`;
 $("car").innerHTML=`<table><tr><th rowspan="2">Transportadora</th><th rowspan="2">OV</th><th rowspan="2">Volumes total</th><th colspan="2">Separação concluída</th><th colspan="2">Falta separar</th>${chs.length?`<th colspan="${chs.length}">Canal de venda (OV)</th>`:""}</tr><tr><th>OV</th><th>Volumes</th><th>OV</th><th>Volumes</th>${chs.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>`+
  (A.C.map(r=>`<tr><td>${esc(r.t)}</td><td>${fmt(r.p)}</td><td>${fmt(r.v)}</td><td>${fmt(r.sp)}</td><td>${fmt(r.sv)}</td><td class="w">${fmt(r.fp)}</td><td class="w">${fmt(r.fv)}</td>${chs.map(x=>`<td>${fmt(r.ch[x]||0)}</td>`).join("")}</tr>`).join("")||none)+
  (A.C.length?`<tr class="t"><td>TOTAL</td><td>${fmt(T.p)}</td><td>${fmt(T.v)}</td><td>${fmt(T.sp)}</td><td>${fmt(T.sv)}</td><td>${fmt(T.fp)}</td><td>${fmt(T.fv)}</td>${A.G.map(g=>`<td>${fmt(g.p)}</td>`).join("")}</tr>`:"")+`</table>`;
 const bar=(a,b)=>`<span class="pb"><i style="width:${b?a/b*100:0}%"></i></span>${pc(a,b)}`;
 $("gal").innerHTML=`<table style="min-width:560px"><tr><th rowspan="2">Canal de venda</th><th colspan="2">Total</th><th colspan="2">Separado</th><th colspan="2">Falta separar</th><th rowspan="2">% separado</th></tr><tr><th>OV</th><th>Volumes</th><th>OV</th><th>Volumes</th><th>OV</th><th>Volumes</th></tr>`+
  A.G.map(g=>`<tr><td>${esc(g.c)}</td><td>${fmt(g.p)}</td><td>${fmt(g.v)}</td><td>${fmt(g.sp)}</td><td>${fmt(g.sv)}</td><td class="w">${fmt(g.fp)}</td><td class="w">${fmt(g.fv)}</td><td>${bar(g.sv,g.v)}</td></tr>`).join("")+
  (A.G.length?`<tr class="t"><td>TOTAL</td><td>${fmt(T.p)}</td><td>${fmt(T.v)}</td><td>${fmt(T.sp)}</td><td>${fmt(T.sv)}</td><td>${fmt(T.fp)}</td><td>${fmt(T.fv)}</td><td>${bar(T.sv,T.v)}</td></tr>`:"")+`</table>`;
 $("pre").innerHTML=`<table style="min-width:560px"><tr><th rowspan="2">Canal de venda</th><th colspan="2">Falta separar</th><th colspan="2">Liberado p/ separar</th><th colspan="2">Preso em remanejamento</th><th rowspan="2">% preso (volumes)</th></tr><tr><th>OV</th><th>Volumes</th><th>OV</th><th>Volumes</th><th>OV</th><th>Volumes</th></tr>`+
  A.G.map(g=>`<tr><td>${esc(g.c)}</td><td>${fmt(g.fp)}</td><td>${fmt(g.fv)}</td><td>${fmt(g.lp)}</td><td>${fmt(g.lv)}</td><td class="w">${fmt(g.pp)}</td><td class="w">${fmt(g.pv)}</td><td>${bar(g.pv,g.fv)}</td></tr>`).join("")+
  (A.G.length?`<tr class="t"><td>TOTAL</td><td>${fmt(T.fp)}</td><td>${fmt(T.fv)}</td><td>${fmt(T.lp)}</td><td>${fmt(T.lv)}</td><td>${fmt(T.pp)}</td><td>${fmt(T.pv)}</td><td>${bar(T.pv,T.fv)}</td></tr>`:"")+`</table>`;
 const cfTab=f=>A.hasCf?`<table style="min-width:340px"><tr><th>Transportadora</th><th>Volumes</th><th>% da transportadora</th></tr>`+A.C.slice().sort((a,b)=>(b[f]||0)-(a[f]||0)).map(r=>`<tr><td>${esc(r.t)}</td><td>${fmt(r[f]||0)}</td><td>${bar(r[f]||0,r.v)}</td></tr>`).join("")+`<tr class="t"><td>TOTAL</td><td>${fmt(T[f]||0)}</td><td>${bar(T[f]||0,T.v)}</td></tr></table>`:`<p style="color:var(--mu);text-align:center;padding:16px 0">Reimporte a planilha do dia para calcular a conferência.</p>`;
 $("cfx").innerHTML=cfTab("xv");$("cfc").innerHTML=cfTab("cv");
 if(full||!inField()){
  const inp=(a,k,v,mn)=>ST.ed?`<input type="number" min="${mn}" data-${a}="${esc(k)}" value="${v}" aria-label="${a==="p"?"Produtividade":"Colaboradores"} ${esc(k)}">`:fmt(v);
  $("lab").innerHTML=`<table style="min-width:640px"><tr><th>Canal de venda</th><th>Falta separar (volumes)</th><th>Produtividade (vol/h por colaborador)</th><th>Colaboradores</th><th>Capacidade (vol/h)</th><th>Tempo necessário (horas)</th><th>Tempo (HH:MM)</th></tr>`+
   L.r.map((x,i)=>`<tr><td>${esc(x.g.c)}</td><td class="w">${fmt(x.g.fv)}</td><td>${inp("p",x.g.c,x.p,1)}</td><td>${inp("w",x.g.c,x.w,0)}</td><td id="cap${i}"></td><td id="hr${i}"></td><td id="tm${i}"></td></tr>`).join("")+
   (L.r.length?`<tr class="t"><td>OPERAÇÃO</td><td>${fmt(T.fv)}</td><td></td><td id="wop"></td><td id="cop"></td><td id="hop"></td><td id="top"></td></tr>`:"")+`</table>`;
  document.querySelectorAll("[data-p]").forEach(i=>i.oninput=()=>{W.prod[i.dataset.p]=Math.max(1,num(i.value));save();draw()});
  document.querySelectorAll("[data-w]").forEach(i=>i.oninput=()=>{W.col[i.dataset.w]=Math.max(0,num(i.value));save();draw()})}
 const hs=h=>isFinite(h)?h.toLocaleString("pt-BR",{maximumFractionDigits:2}):"—";
 L.r.forEach((x,i)=>{$("cap"+i).textContent=fmt(x.cap);$("hr"+i).textContent=hs(x.h);$("tm"+i).textContent=hmc(x.h)});
 if(L.r.length){$("wop").textContent=fmt(L.W2);$("cop").textContent=fmt(L.CP);$("hop").textContent=hs(L.MX);$("top").textContent=hmc(L.MX)}
 drawHist();
}
function drawHist(){const e=$("hist");if(!e)return;if(ST.ed&&e.contains(document.activeElement)&&document.activeElement.tagName==="INPUT")return;
 const id=curCd().id;let L=(ST.hist||[]).filter(h=>h.cd===id).sort((a,b)=>a.date<b.date?1:-1);
 if(ST.hf)L=L.filter(h=>h.date===ST.hf);else L=L.slice(0,31);
 e.innerHTML=L.length?`<table style="min-width:${ST.ed?460:360}px"><tr><th>Data</th><th>Volumes expedidos</th><th>Último registro</th>${ST.ed?"<th></th>":""}</tr>`+L.map(h=>`<tr><td>${dbr(h.date)}</td><td style="color:#3B8BEB;font-weight:700">${ST.ed?`<input type="number" min="0" inputmode="numeric" data-hd="${h.date}" value="${Math.round(h.emb)}" aria-label="Volumes expedidos em ${dbr(h.date)}">`:fmt(h.emb)}${h.man?` <small style="color:var(--mu);font-weight:400">manual</small>`:""}</td><td>${tm(h.edt)}</td>${ST.ed?`<td><button class="gh" data-hx="${h.date}">Excluir</button></td>`:""}</tr>`).join("")+`</table>`:`<p style="color:var(--mu);text-align:center;padding:16px 0">${ST.hf?"Nenhum registro em "+dbr(ST.hf)+".":"Nenhum registro ainda."}</p>`;
 e.querySelectorAll("[data-hd]").forEach(i=>i.onchange=()=>manualHist(i.dataset.hd,num(i.value)));
 e.querySelectorAll("[data-hx]").forEach(b=>b.onclick=async()=>{if(await ask("Excluir registro",{msg:"Excluir o registro de "+dbr(b.dataset.hx)+"?"}))delHist(b.dataset.hx)})}
async function manualHist(date,v){if(!sb||!ST.ed)return;const id=curCd().id,old=(ST.hist||[]).find(h=>h.cd===id&&h.date===date)||{};
 const x=await sb.rpc("save_hist",{p:ST.pw,h:{cd:id,date,dia:old.dia||0,emb:Math.max(0,v),sep:old.sep||0,falta:old.falta||0,preso:old.preso||0,ped:old.ped||0,vol:old.vol||0,pend:old.pend||0,edt:new Date().toISOString()}});
 if(x.error){toast("Não foi possível salvar: "+x.error.message,1);return}toast("Lançamento salvo");await loadHist();drawHist()}
async function delHist(date){if(!sb||!ST.ed)return;const x=await sb.rpc("del_hist",{p:ST.pw,c:curCd().id,d:date});if(x.error){toast("Não foi possível excluir: "+x.error.message,1);return}toast("Registro excluído");await loadHist();drawHist()}
let ch=null,lastP="",pid="",rt;
function setPresence(){if(!ch||!ch.ready)return;const p={cd:curCd().id,ed:ST.ed?1:0},k=JSON.stringify(p);if(k===lastP)return;lastP=k;ch.track(p)}
function drawOnline(){const e=$("onl");if(!e)return;const ks=Object.keys(ST.peers||{});if(!ks.length){e.hidden=true;return}
 let ed=0;const per={};ks.forEach(k=>{const ms=ST.peers[k];if(ms.some(m=>m.ed))ed++;const m=ms[0];if(m&&m.cd)per[m.cd]=(per[m.cd]||0)+1});
 e.hidden=false;e.textContent=ks.length+" online"+(ed?" · "+ed+" editor"+(ed>1?"es":""):"");e.title=ST.cds.map(c=>c.name+": "+(per[c.id]||0)).join(" · ")}
function clock(){const e=$("clk");if(e)e.textContent=new Date().toLocaleString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(",",",")}
setInterval(clock,20000);
let tm2;function save(now){if(!sb||!ST.ed)return;clearTimeout(tm2);
 tm2=setTimeout(async()=>{W.edt=new Date().toISOString();const cd=curCd().id,date=ST.date;
  try{const c=W.cut,T=agg().T,dia=c.cont+c.c1+c.c2+c.c3+c.c4;
   const r=await sb.rpc("save_day",{p:ST.pw,d:{cd,date,rows:W.rows,src:W.src,cut:W.cut,col:W.col,prod:W.prod,upd:W.upd||"",edt:W.edt,file:W.file},h:{cd,date,dia:dia||T.v,emb:Math.max(0,dia-T.v),sep:T.sv,falta:T.fv,preso:T.pv,ped:T.p,vol:T.v,pend:c.pend,edt:W.edt}});
   if(r.error)throw r.error;toast("Salvo")}
  catch(e){const m=e.message||"erro";if(/senha/i.test(m)){ST.ed=false;ST.pw="";try{localStorage.removeItem("pe-pw")}catch(x){}render()}toast("Não foi possível salvar: "+m,1)}},now?0:600)}
function bind(){const g=id=>$(id);
 g("dt").onchange=e=>{ST.date=e.target.value;W=mk();render();loadDay()};
 if(g("inb"))g("inb").onclick=enter;
 if(g("out"))g("out").onclick=()=>{ST.ed=false;ST.pw="";try{localStorage.removeItem("pe-pw")}catch(e){}render()};
 if(g("pw"))g("pw").onclick=async()=>{const r=await ask("Nova senha",{fields:[{label:"Nova senha (mínimo 4 caracteres)",type:"password"}]});if(!r||!r[0])return;
  if(r[0].length<4){toast("Senha muito curta",1);return}const x=await sb.rpc("set_pw",{p:ST.pw,np:r[0]});if(x.error){toast(x.error.message,1);return}ST.pw=r[0];try{localStorage.setItem("pe-pw",r[0])}catch(e){}toast("Senha alterada")};
 if(g("addcd"))g("addcd").onclick=async()=>{const r=await ask("Novo CD",{fields:[{label:"Nome (ex.: CD Conde)"},{label:"Canais de venda (ex.: L019 ou L021 · LA21)"}]});if(!r||!r[0]||!r[1])return;
  let id="cd-"+r[0].normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/^cd\s*/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(ST.cds.some(c=>c.id===id))id+="-2";
  const x=await sb.rpc("save_cd",{p:ST.pw,c:{id,name:r[0],sub:r[1],pos:ST.cds.length+1}});if(x.error){toast("Não foi possível criar: "+x.error.message,1);return}await loadCds();location.hash=id};
 if(g("hf")){g("hf").onchange=e=>{ST.hf=e.target.value;drawHist()};g("hfc").onclick=()=>{ST.hf="";g("hf").value="";drawHist()}}
 if(g("mb"))g("mb").onclick=()=>{const d=g("md").value;if(!d||g("mv").value===""){toast("Informe o dia e os volumes",1);return}manualHist(d,num(g("mv").value));g("mv").value=""}
 if(g("fl"))g("fl").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"});let r=null,er;
   for(const n of wb.SheetNames){try{r=parseGrid(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));break}catch(x){er=x}}
   if(!r)throw er;W.rows=r.rows;W.src=r.src;W.file=f.name;W.upd=new Date().toISOString();save(true);draw(true);toast("Planilha importada")}catch(x){toast(x.message||"Não consegui ler o arquivo.",1)}};rd.readAsArrayBuffer(f)};
}
async function enter(){const r=await ask("Entrar como editor",{fields:[{label:"Senha de editor",type:"password"}]});if(!r||!r[0])return;
 const x=await sb.rpc("check_pw",{p:r[0]});if(x.error||x.data!==true){toast("Senha incorreta",1);return}
 ST.pw=r[0];ST.ed=true;try{localStorage.setItem("pe-pw",r[0])}catch(e){}render();toast("Modo editor ativo")}
async function loadCds(){const x=await sb.from("cds").select("id,name,sub").order("pos");if(x.error)throw x.error;if(x.data&&x.data.length)ST.cds=x.data}
async function loadIds(){const x=await sb.from("days").select("cd,date");if(x.error)throw x.error;ST.ids=(x.data||[]).map(d=>d.cd+"_"+d.date)}
async function loadHist(){const x=await sb.from("history").select("*");if(x.error)throw x.error;ST.hist=x.data||[]}
async function loadDay(){const cd=curCd().id,date=ST.date;
 const x=await sb.from("days").select("*").eq("cd",cd).eq("date",date).maybeSingle();
 if(x.error){ST.nodb=true;ST.err=x.error.message;render();return}
 if(cd!==curCd().id||date!==ST.date)return;
 ST.nodb=false;ST.err="";if(!(ST.ed&&inField()))W=mk(x.data);inField()?draw():render()}
async function refresh(){if(inField())return;try{await Promise.all([loadCds(),loadIds(),loadHist()]);await loadDay()}catch(e){ST.nodb=true;ST.err=(e&&(e.message||e.code))||String(e);render()}}
window.addEventListener("hashchange",()=>{W=mk();render();loadDay()});
render();
(function(){const C=window.PAINEL_CONFIG||{};
 if(!window.supabase){ST.nodb=true;ST.err="a biblioteca do Supabase não carregou";render();return}
 if(!C.url||C.url.indexOf("COLE_AQUI")>=0){ST.nodb=true;ST.err="URL e chave do Supabase não preenchidas no index.html";render();return}
 sb=window.supabase.createClient(C.url,C.key);
 try{const sp=localStorage.getItem("pe-pw");if(sp)sb.rpc("check_pw",{p:sp}).then(x=>{if(x.data===true){ST.pw=sp;ST.ed=true;render()}else{try{localStorage.removeItem("pe-pw")}catch(e){}}})}catch(e){}
 try{pid=localStorage.getItem("pe-id")||"";if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("pe-id",pid)}}catch(e){pid=Math.random().toString(36).slice(2)}
 ch=sb.channel("painel-online",{config:{presence:{key:pid}}});
 ch.on("presence",{event:"sync"},()=>{ST.peers=ch.presenceState();drawOnline()}).subscribe(st=>{if(st==="SUBSCRIBED"){ch.ready=true;lastP="";setPresence()}});
 sb.channel("painel-db").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rt);rt=setTimeout(refresh,400)}).subscribe();
 refresh();setInterval(refresh,30000);
})();
</script>
</body>
</html>
